name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Core suite (offline; live-DB/API integration tests deselected)
        env:
          DATABASE_URL: ""
        run: |
          pytest -p no:cacheprovider -o addopts= -q tests -m "not integration"
